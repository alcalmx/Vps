# Kickstart — construcción DESATENDIDA de la plantilla dorada AlmaLinux 9.7.
# Se entrega en un mini-ISO con etiqueta OEMDRV (anaconda lo toma solo, sin tocar
# el menú de boot). Ver dorada/README.md para el procedimiento completo.
#
# ANTES DE USAR reemplazar los placeholders:
#   __IP_TEMPORAL__  IP libre de 192.168.122.0/24 solo para el %post (dnf)
#   __MGMT_PUBKEY__  llave pública de gestión (gestion@hosting.cl)

text
lang es_CL.UTF-8
keyboard latam
timezone America/Santiago --utc
# DHCP, sin IP baked: cloud-init pone la IP estática real en cada clon.
# (Antes se horneaba una IP estática → el clon arrancaba con esa IP hasta que
#  cloud-init la sobrescribía; con DHCP no queda identidad de red horneada.)
network --bootproto=dhcp --device=link --activate --hostname=dorada.hosting.cl
# root solo con llave (la instala el %post); el lock NO bloquea SSH con llave
rootpw --lock
selinux --enforcing
firewall --enabled --service=ssh
bootloader --location=mbr
zerombr
clearpart --all --initlabel
# / al FINAL y sin LVM: growpart (cloud-init) crece la última partición al
# tamaño del sabor en el primer boot de cada clon
part /boot --fstype=xfs --size=1024
part swap --size=2048
part / --fstype=xfs --size=6000 --grow
reboot   # el firstboot lo apaga (systemd unit del %post) tras la auto-limpieza

# cloud-init + open-vm-tools van AQUÍ (no en %post con dnf): anaconda los instala
# desde el repo del PROPIO ISO. Crítico: la VLAN de construcción puede NO tener
# salida a internet (NAT por whitelist de IP), así que un `dnf install` en %post
# falla. Desde el ISO es independiente de la red.
%packages --excludedocs
@core
openssh-server
cloud-init
open-vm-tools
cloud-utils-growpart
-iwl*-firmware
-plymouth*
%end

%post --log=/root/ks-post.log
set -x
# los paquetes ya vienen del ISO (%packages) — el %post solo configura
systemctl enable cloud-init cloud-init-local cloud-config cloud-final vmtoolsd sshd

# solo el datasource VMware (guestinfo) — evita esperas de otros datasources
cat > /etc/cloud/cloud.cfg.d/90-vmware.cfg <<'EOF'
datasource_list: [ VMware, None ]
EOF

# llave de gestión + sshd endurecido (igual estándar que VpsClientes)
mkdir -p /root/.ssh && chmod 700 /root/.ssh
echo "__MGMT_PUBKEY__" > /root/.ssh/authorized_keys
chmod 600 /root/.ssh/authorized_keys
printf 'PermitRootLogin prohibit-password\nPasswordAuthentication no\n' > /etc/ssh/sshd_config.d/00-hosting.conf

# unit de un solo uso: al primer boot post-instalación se auto-limpia la
# identidad (para que cada clon sea único) y se apaga → queda lista la dorada
cat > /etc/systemd/system/dorada-seal.service <<'EOF'
[Unit]
Description=Sella la plantilla dorada (limpia identidad y apaga)
[Service]
Type=oneshot
ExecStart=/usr/local/sbin/dorada-seal.sh
[Install]
WantedBy=multi-user.target
EOF
cat > /usr/local/sbin/dorada-seal.sh <<'EOF'
#!/bin/sh
systemctl disable dorada-seal.service
rm -f /etc/systemd/system/dorada-seal.service /usr/local/sbin/dorada-seal.sh
cloud-init clean --logs --seed
truncate -s 0 /etc/machine-id
rm -f /etc/ssh/ssh_host_*        # cada clon regenera sus host keys
rm -f /root/ks-post.log /root/anaconda-ks.cfg
poweroff
EOF
chmod +x /usr/local/sbin/dorada-seal.sh
systemctl enable dorada-seal.service
%end
